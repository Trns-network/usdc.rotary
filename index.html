<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>USDT Transaction Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #003366;
      text-align: center;
      padding: 50px;
    }
    #logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    #balance {
      font-size: 32px;
      margin: 20px 0;
    }
    #withdrawal-section {
      display: none;
      margin-top: 20px;
    }
    #error-message {
      color: red;
      font-weight: bold;
      margin-top: 20px;
      display: none;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 300px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="logo">🔐 Trust Wallet</div>
  <div id="balance">USDT Balance: $0</div>
  <button onclick="startLoading()">Start USDT Transaction</button>

  <div id="withdrawal-section">
    <h3>Withdraw USDT</h3>
    <input type="text" id="usdtAddress" placeholder="Enter your USDT address" />
    <br/>
    <button onclick="confirmWithdrawal()">Confirm Withdrawal</button>
  </div>

  <div id="error-message">⚠️ Error: 25 TRX fee required to proceed</div>

  <script>
    function startLoading() {
      let balance = 1;
      const target = 107000;
      const duration = 20000;
      const interval = duration / (target - balance);
      const balanceDisplay = document.getElementById("balance");

      const loader = setInterval(() => {
        balance++;
        balanceDisplay.textContent = `USDT Balance: $${balance.toLocaleString()}`;
        if (balance >= target) {
          clearInterval(loader);
          document.getElementById("withdrawal-section").style.display = "block";
        }
      }, interval);
    }

    function confirmWithdrawal() {
      const address = document.getElementById("usdtAddress").value;
      if (!address) {
        alert("Please enter a valid USDT address.");
        return;
      }
      document.getElementById("error-message").style.display = "none";
      setTimeout(() => {
        document.getElementById("error-message").style.display = "block";
      }, 10000);
    }
  </script>
</body>
</html>
